<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f0a">
<title>SÉQUENCE — Jeu de Mémoire</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #060a06;
    --surface: #0d150d;
    --border: #1a2e1a;
    --accent: #00ff41;
    --accent-dim: #003d0f;
    --red: #ff3030;
    --yellow: #ffdd00;
    --blue: #00aaff;
    --green: #00ff41;
    --orange: #ff6600;
    --text: #8fbc8f;
    --text-bright: #ccffcc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Scanlines effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 5vw, 40px);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 8px;
    text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(0,255,65,0.3);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(0,255,65,0.3); }
    50% { text-shadow: 0 0 30px var(--accent), 0 0 60px rgba(0,255,65,0.5); }
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text);
    margin-top: 4px;
    opacity: 0.7;
  }

  .status-bar {
    display: flex;
    gap: 32px;
    margin-bottom: 28px;
    font-size: 13px;
    letter-spacing: 2px;
  }

  .stat {
    text-align: center;
  }

  .stat-label {
    opacity: 0.5;
    font-size: 10px;
    display: block;
    margin-bottom: 2px;
  }

  .stat-value {
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 0 0 10px var(--accent);
  }

  .game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,255,65,0.05), inset 0 0 40px rgba(0,0,0,0.5);
    position: relative;
  }

  .grid::before {
    content: '◆ PANNEAU DE CONTRÔLE ◆';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--accent);
    background: var(--surface);
    padding: 0 8px;
    white-space: nowrap;
  }

  .btn {
    width: 130px;
    height: 130px;
    border-radius: 6px;
    border: 2px solid;
    cursor: pointer;
    position: relative;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    user-select: none;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 60%);
  }

  .btn::after {
    content: '';
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }

  .btn-red {
    background: rgba(255,48,48,0.08);
    border-color: rgba(255,48,48,0.3);
    color: rgba(255,80,80,0.6);
  }
  .btn-yellow {
    background: rgba(255,221,0,0.08);
    border-color: rgba(255,221,0,0.3);
    color: rgba(255,221,0,0.6);
  }
  .btn-blue {
    background: rgba(0,170,255,0.08);
    border-color: rgba(0,170,255,0.3);
    color: rgba(0,170,255,0.6);
  }
  .btn-green {
    background: rgba(0,255,65,0.08);
    border-color: rgba(0,255,65,0.3);
    color: rgba(0,255,65,0.6);
  }

  .btn.lit.btn-red {
    background: rgba(255,48,48,0.5);
    border-color: #ff3030;
    color: #ff3030;
    box-shadow: 0 0 30px rgba(255,48,48,0.8), inset 0 0 20px rgba(255,48,48,0.3);
  }
  .btn.lit.btn-yellow {
    background: rgba(255,221,0,0.5);
    border-color: #ffdd00;
    color: #ffdd00;
    box-shadow: 0 0 30px rgba(255,221,0,0.8), inset 0 0 20px rgba(255,221,0,0.3);
  }
  .btn.lit.btn-blue {
    background: rgba(0,170,255,0.5);
    border-color: #00aaff;
    color: #00aaff;
    box-shadow: 0 0 30px rgba(0,170,255,0.8), inset 0 0 20px rgba(0,170,255,0.3);
  }
  .btn.lit.btn-green {
    background: rgba(0,255,65,0.5);
    border-color: #00ff41;
    color: #00ff41;
    box-shadow: 0 0 30px rgba(0,255,65,0.8), inset 0 0 20px rgba(0,255,65,0.3);
  }

  .btn.wrong {
    animation: shake 0.3s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .btn-label {
    position: relative;
    z-index: 1;
    opacity: 0.7;
  }

  .controls {
    display: flex;
    gap: 12px;
  }

  .action-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-100%);
    transition: transform 0.2s;
  }

  .action-btn:hover::before { transform: translateX(0); }
  .action-btn:hover { color: var(--bg); }

  .action-btn span { position: relative; z-index: 1; }

  .action-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .action-btn:disabled::before { display: none; }
  .action-btn:disabled:hover { color: var(--accent); }

  .message {
    height: 24px;
    font-size: 13px;
    letter-spacing: 3px;
    text-align: center;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
    transition: opacity 0.3s;
  }

  .message.error {
    color: var(--red);
    text-shadow: 0 0 10px var(--red);
    animation: blink 0.3s linear 3;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    transition: width 0.3s;
    width: 0%;
  }

  .best-label {
    font-size: 10px;
    opacity: 0.4;
    letter-spacing: 2px;
    margin-top: 8px;
  }

  @media (max-width: 400px) {
    .btn { width: 110px; height: 110px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">SÉQUENCE</div>
  <div class="subtitle">PROTOCOLE DE MÉMOIRE · v1.0</div>
</div>

<div class="status-bar">
  <div class="stat">
    <span class="stat-label">NIVEAU</span>
    <span class="stat-value" id="level">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">SCORE</span>
    <span class="stat-value" id="score">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">RECORD</span>
    <span class="stat-value" id="best">0</span>
  </div>
</div>

<div class="game-container">
  <div class="message" id="msg">APPUYER SUR DÉMARRER</div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="grid">
    <button class="btn btn-red" id="btn-0" onclick="playerClick(0)">
      <span class="btn-label">ALERTE</span>
    </button>
    <button class="btn btn-yellow" id="btn-1" onclick="playerClick(1)">
      <span class="btn-label">AVERT.</span>
    </button>
    <button class="btn btn-blue" id="btn-2" onclick="playerClick(2)">
      <span class="btn-label">INFO</span>
    </button>
    <button class="btn btn-green" id="btn-3" onclick="playerClick(3)">
      <span class="btn-label">CONF.</span>
    </button>
  </div>

  <div class="controls">
    <button class="action-btn" id="startBtn" onclick="startGame()"><span>▶ DÉMARRER</span></button>
  </div>
</div>

<script>
const COLORS = ['btn-red','btn-yellow','btn-blue','btn-green'];
const FREQS = [261, 329, 392, 523]; // C, E, G, C octave

let sequence = [];
let playerSeq = [];
let level = 0;
let score = 0;
let best = parseInt(localStorage.getItem('seq_best') || '0');
let playing = false;
let canClick = false;
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(idx, dur = 200) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = FREQS[idx];
    osc.type = 'square';
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur/1000);
  } catch(e) {}
}

function playError() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 80;
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

function litBtn(idx, duration = 300) {
  return new Promise(resolve => {
    const btn = document.getElementById('btn-' + idx);
    btn.classList.add('lit');
    playTone(idx, duration);
    setTimeout(() => {
      btn.classList.remove('lit');
      resolve();
    }, duration);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function setMsg(text, error = false) {
  const el = document.getElementById('msg');
  el.className = 'message' + (error ? ' error' : '');
  el.textContent = text;
}

function updateUI() {
  document.getElementById('level').textContent = level;
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}

function setProgress(val) {
  document.getElementById('progress').style.width = val + '%';
}

async function showSequence() {
  canClick = false;
  setMsg('OBSERVEZ LA SÉQUENCE...');
  document.getElementById('startBtn').disabled = true;

  // Speed increases with level
  const speed = Math.max(150, 500 - level * 20);
  const gap = Math.max(80, 200 - level * 5);

  for (let i = 0; i < sequence.length; i++) {
    await sleep(gap);
    await litBtn(sequence[i], speed);
  }

  await sleep(300);
  canClick = true;
  playerSeq = [];
  setProgress(0);
  setMsg('À VOTRE TOUR — ' + sequence.length + ' PAS');
}

async function startGame() {
  sequence = [];
  playerSeq = [];
  level = 0;
  score = 0;
  playing = true;
  updateUI();
  await nextRound();
}

async function nextRound() {
  level++;
  sequence.push(Math.floor(Math.random() * 4));
  updateUI();
  await sleep(600);
  await showSequence();
}

async function playerClick(idx) {
  if (!playing || !canClick) return;

  await litBtn(idx, 150);
  playerSeq.push(idx);

  const pos = playerSeq.length - 1;
  setProgress((playerSeq.length / sequence.length) * 100);

  if (playerSeq[pos] !== sequence[pos]) {
    // Erreur
    canClick = false;
    playing = false;
    playError();
    document.querySelectorAll('.btn').forEach(b => b.classList.add('wrong'));
    setTimeout(() => document.querySelectorAll('.btn').forEach(b => b.classList.remove('wrong')), 400);
    
    if (score > best) {
      best = score;
      localStorage.setItem('seq_best', best);
    }
    updateUI();
    setMsg('✗ ERREUR — NIVEAU ' + level + ' — SCORE ' + score, true);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').querySelector('span').textContent = '↺ REJOUER';
    return;
  }

  score += 10 * level;
  updateUI();

  if (playerSeq.length === sequence.length) {
    // Séquence complète
    canClick = false;
    setMsg('✓ CORRECT — CONTINUEZ...');
    await sleep(800);
    await nextRound();
  }
}

// Update best on load
document.getElementById('best').textContent = best;

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
